# Standalone Worker that owns the live-reader presence Durable Object.
#
# It is deployed separately from the Pages site because Pages Functions cannot
# create or migrate Durable Objects. The site talks to it over WebSocket + HTTP.
name = "noor-live"
main = "src/index.ts"
compatibility_date = "2026-10-19"

# Comma-separated browser origins allowed to open the WebSocket and call the
# counter endpoints. "*" allows any origin; set your real origins in production.
[vars]
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceHub"]

[observability]
enabled = true
