name: Deploy to GitHub Pages

# Deploys the whole site — the static Next.js export AND the Pagefind search
# index — to GitHub Pages in a single artifact. GitHub Pages has no 20k-file
# limit (only a 1 GB total cap), so the ~43k-file index ships alongside the
# site and is served same-origin at <pages-root>/pagefind/. No Cloudflare, no
# separate index workflow, no prune step.
#
# This is a *project* site, so it serves from a subpath
# (https://<owner>.github.io/<repo>/). next.config.ts reads NEXT_PUBLIC_BASE_PATH
# to prefix assets/routes accordingly.
#
# One-time setup: repo Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions".

on:
  # Deploy only on version tags — never on raw branch pushes. versioning.yml
  # tags every main push (via RELEASE_TOKEN, a PAT, so the tag push DOES trigger
  # this workflow), so each release still deploys exactly once. This also makes
  # tags the single source of truth for what's live, which is the rollback /
  # break-glass path: if production breaks, push (or force-move) a known-good
  # `v*` tag and this workflow ships that exact commit — no need to revert main.
  push:
    tags:
      - "v*"
  # Manual trigger, primarily for rollback. Enter a known-good tag (e.g. v0.2.1)
  # in the "ref" input and this ships that exact commit. Leave blank to deploy
  # whatever ref the run was launched from (the "Use workflow from" dropdown).
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/SHA to deploy (for rollback). Blank = current ref."
        required: false
  # Refresh twice daily so the videos grid keeps showing each scholar's latest
  # uploads without a manual push. Cron is UTC; 06:07 and 18:07 avoid the top of
  # the hour when GitHub's scheduler is most congested (and may drop/delay jobs).
  # Each run re-fetches YouTube data (npm run fetch:youtube) and redeploys.
  schedule:
    - cron: "7 6,18 * * *"

# GitHub Pages deploy needs these; id-token is required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-progress run finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Build only. The deploy lives in its own job below — see the comment there for
  # why the two must not share a job.
  build:
    runs-on: ubuntu-latest
    env:
      # Repo name = URL subpath. Both vars are read at build time:
      #  - NEXT_PUBLIC_BASE_PATH  -> next.config.ts basePath/assetPrefix
      #  - NEXT_PUBLIC_PAGEFIND_BUNDLE -> same-origin index path (search/pagefind.ts)
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_PAGEFIND_BUNDLE: /${{ github.event.repository.name }}/pagefind
      # Live layer (components/realtime + /live). Deploy workers/live with
      # `npm run live:deploy`, then add its URL as a repo variable
      # (Settings -> Secrets and variables -> Actions -> Variables).
      # Leave it unset and nothing live renders.
      NEXT_PUBLIC_LIVE_URL: ${{ vars.NEXT_PUBLIC_LIVE_URL }}
      # Optional kill switch. Set this repo variable to "off" to publish only the
      # page path; totals, per-page counts, and visits keep working while
      # per-surah, trending, and activity go quiet.
      NEXT_PUBLIC_LIVE_DETAIL: ${{ vars.NEXT_PUBLIC_LIVE_DETAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Rollback: check out the tag/SHA from the workflow_dispatch input when
          # provided; otherwise fall back to the ref that triggered the run.
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fail fast instead of shipping a site that renders "Live counter is not
      # connected" on /live. NEXT_PUBLIC_* is inlined at build time, so an empty
      # value is silent: the build succeeds, the deploy succeeds, and the only
      # symptom appears later in the browser. Anything that would produce a
      # dead /live page fails here in seconds instead of after a full build.
      - name: Check live Worker URL is configured
        run: |
          # This log is public (public repo), and so is every fork's. Register the
          # hostname as a masked value before anything can echo it, then never
          # print it: the checks below report *which* rule failed, not the value.
          url="${NEXT_PUBLIC_LIVE_URL%/}"
          for secret in "$NEXT_PUBLIC_LIVE_URL" "$url" "${url#https://}"; do
            [ -n "$secret" ] && echo "::add-mask::$secret"
          done
          if [ -z "$url" ]; then
            echo "::error::NEXT_PUBLIC_LIVE_URL is empty. Add it as a repository VARIABLE (Settings -> Secrets and variables -> Actions -> Variables tab, NOT Secrets), value https://noor-live.<account>.workers.dev, then re-run this workflow."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_LIVE_URL must be an absolute https:// URL (value masked)."; exit 1 ;;
          esac
          case "$url" in
            */ws|*/stats|*/visit) echo "::error::NEXT_PUBLIC_LIVE_URL ends with /ws, /stats or /visit - use the bare Worker origin, no path (value masked)."; exit 1 ;;
          esac
          echo "::notice::Live Worker URL is set and well formed (host masked)."
      # Reachability probe. Warn-only: a Worker hiccup or a Cloudflare blip must
      # not block a site deploy, but a typo'd hostname should be visible in the
      # run log before anyone goes looking in the browser console.
      - name: Probe live Worker
        run: |
          url="${NEXT_PUBLIC_LIVE_URL%/}"
          for secret in "$NEXT_PUBLIC_LIVE_URL" "$url" "${url#https://}"; do
            [ -n "$secret" ] && echo "::add-mask::$secret"
          done
          # Only the Worker's own JSON body is echoed ({"ok":true}), never the URL.
          if out=$(curl -fsS -m 10 "$url/health"); then
            echo "::notice::Live Worker /health answered: $out"
          else
            echo "::warning::Live Worker /health did not answer (DNS, TLS or non-2xx). Check the Worker is deployed and the variable is exact - the host is masked here, so compare it in Settings -> Variables."
          fi
      - run: npm ci
      # Fetch each scholar's latest long-form videos by scraping their public
      # YouTube "/videos" tab into public/data/youtube/. Runs on GitHub's US
      # runner, so channels that are region-restricted still resolve; no API key
      # needed. Shorts are excluded at fetch time. Non-fatal: the script writes
      # empty files on per-channel failure and the site falls back to mock data,
      # so a transient fetch hiccup can't break the deploy.
      - run: npm run fetch:youtube
      # Build the search index first, then the static site. build:pagefind
      # writes public/pagefind/, which `next build` copies into out/pagefind/.
      - run: npm run build:pagefind
      - run: npm run build
      # Belt and braces: the env guard above runs before the build, so this only
      # fires if something inside Next itself dropped the variable (for example a
      # config change that stops inlining process.env). Catches the exact failure
      # that shipped an unconfigured /live page before.
      - name: Verify live URL was inlined into the bundle
        run: |
          url="${NEXT_PUBLIC_LIVE_URL%/}"
          host="${url#https://}"
          for secret in "$NEXT_PUBLIC_LIVE_URL" "$url" "$host"; do
            [ -n "$secret" ] && echo "::add-mask::$secret"
          done
          if grep -rqs -- "$host" out/_next/static/chunks; then
            echo "::notice::Live Worker host was inlined into out/_next/static/chunks."
          else
            echo "::error::The build finished but the configured Worker host does not appear in any client chunk, so /live would render the setup notice. Check that NEXT_PUBLIC_LIVE_URL is exported to the build step (value masked)."
            exit 1
          fi
      # Prune build-only inputs from the artifact. The *-all.json files (Quran +
      # each hadith collection, ~176 MB) are read at build time by build:pagefind
      # and lib/quran/translations.ts, then copied into out/ by `next build` — but
      # the client never fetches them (it requests per-book book-*.json and
      # per-surah surah-*.json only). Dropping them keeps the deployed artifact to
      # what browsers actually load and reclaims headroom under Pages' 1 GB cap.
      - run: find out/data -name '*-all.json' -delete
      # Jekyll (GitHub Pages' default) ignores files/dirs starting with "_",
      # which would drop Next's _next/ asset folder. Disable it.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v5 skips dot-prefixed files unless told otherwise, which would drop
          # the .nojekyll created above. Keep v3's old behaviour explicitly.
          include-hidden-files: true

  # Deploy is a separate job, deliberately. actions/deploy-pages resolves the
  # "github-pages" artifact by listing artifacts *for the current run* through
  # the artifact service. When the upload and the deploy share a job, that
  # listing can run a few hundred milliseconds after the upload was finalized
  # and still come back empty — the log shows "Found 0 artifact(s)" followed by
  # 'No artifacts named "github-pages" were found', which reads like a GitHub
  # outage but is a race (actions/deploy-pages#451; the static starter is the
  # only Pages template that uploads and deploys in one job). Splitting the jobs
  # puts seconds between upload and lookup, which is the documented fix.
  #
  # Second benefit: a partial re-run is safe. "Re-run failed jobs" on this shape
  # re-runs only the deploy, so the run keeps exactly one github-pages artifact.
  # In the old single-job layout it re-uploaded and produced two, failing with
  # 'Multiple artifacts named "github-pages" were unexpectedly found'.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
