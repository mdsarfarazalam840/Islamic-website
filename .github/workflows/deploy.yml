name: Deploy to GitHub Pages

# Deploys the whole site — the static Next.js export AND the Pagefind search
# index — to GitHub Pages in a single artifact. GitHub Pages has no 20k-file
# limit (only a 1 GB total cap), so the ~43k-file index ships alongside the
# site and is served same-origin at <pages-root>/pagefind/. No Cloudflare, no
# separate index workflow, no prune step.
#
# This is a *project* site, so it serves from a subpath
# (https://<owner>.github.io/<repo>/). next.config.ts reads NEXT_PUBLIC_BASE_PATH
# to prefix assets/routes accordingly.
#
# One-time setup: repo Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions".

on:
  # Deploy only on version tags — never on raw branch pushes. versioning.yml
  # tags every main push (via RELEASE_TOKEN, a PAT, so the tag push DOES trigger
  # this workflow), so each release still deploys exactly once. This also makes
  # tags the single source of truth for what's live, which is the rollback /
  # break-glass path: if production breaks, push (or force-move) a known-good
  # `v*` tag and this workflow ships that exact commit — no need to revert main.
  push:
    tags:
      - "v*"
  # Manual trigger, primarily for rollback. Enter a known-good tag (e.g. v0.2.1)
  # in the "ref" input and this ships that exact commit. Leave blank to deploy
  # whatever ref the run was launched from (the "Use workflow from" dropdown).
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/SHA to deploy (for rollback). Blank = current ref."
        required: false
  # Refresh twice daily so the videos grid keeps showing each scholar's latest
  # uploads without a manual push. Cron is UTC; 06:07 and 18:07 avoid the top of
  # the hour when GitHub's scheduler is most congested (and may drop/delay jobs).
  # Each run re-fetches YouTube data (npm run fetch:youtube) and redeploys.
  schedule:
    - cron: "7 6,18 * * *"

# GitHub Pages deploy needs these; id-token is required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-progress run finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Repo name = URL subpath. Both vars are read at build time:
      #  - NEXT_PUBLIC_BASE_PATH  -> next.config.ts basePath/assetPrefix
      #  - NEXT_PUBLIC_PAGEFIND_BUNDLE -> same-origin index path (search/pagefind.ts)
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_PAGEFIND_BUNDLE: /${{ github.event.repository.name }}/pagefind
      # Live layer (lib/supabase/client.ts, components/realtime). Add these under
      # repo Settings -> Secrets and variables -> Actions. The anon key is meant to
      # be public — RLS plus supabase/migrations/0001_site_stats.sql and
      # 0002_visit_rate_limit.sql limit it to reading the counter and calling a
      # rate-limited bump_visits(). Leave them unset and nothing live renders.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Optional kill switch. Set this repo variable to "off" to keep only the
      # footer's online + visits numbers; presence writes fan out to every
      # connected tab, so it is the lever for staying inside the Realtime message
      # quota.
      NEXT_PUBLIC_LIVE_DETAIL: ${{ vars.NEXT_PUBLIC_LIVE_DETAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Rollback: check out the tag/SHA from the workflow_dispatch input when
          # provided; otherwise fall back to the ref that triggered the run.
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fetch each scholar's latest long-form videos by scraping their public
      # YouTube "/videos" tab into public/data/youtube/. Runs on GitHub's US
      # runner, so channels that are region-restricted still resolve; no API key
      # needed. Shorts are excluded at fetch time. Non-fatal: the script writes
      # empty files on per-channel failure and the site falls back to mock data,
      # so a transient fetch hiccup can't break the deploy.
      - run: npm run fetch:youtube
      # Build the search index first, then the static site. build:pagefind
      # writes public/pagefind/, which `next build` copies into out/pagefind/.
      - run: npm run build:pagefind
      - run: npm run build
      # Prune build-only inputs from the artifact. The *-all.json files (Quran +
      # each hadith collection, ~176 MB) are read at build time by build:pagefind
      # and lib/quran/translations.ts, then copied into out/ by `next build` — but
      # the client never fetches them (it requests per-book book-*.json and
      # per-surah surah-*.json only). Dropping them keeps the deployed artifact to
      # what browsers actually load and reclaims headroom under Pages' 1 GB cap.
      - run: find out/data -name '*-all.json' -delete
      # Jekyll (GitHub Pages' default) ignores files/dirs starting with "_",
      # which would drop Next's _next/ asset folder. Disable it.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
