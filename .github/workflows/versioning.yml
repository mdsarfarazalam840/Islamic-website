name: Versioning

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Manual bump type (overrides commit analysis)'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write

jobs:
  # Cheap, ungated pre-check: is there anything new since the last tag? This is
  # split out from the release job on purpose. The approval gate lives on the
  # release job, and job-level `if:` is evaluated BEFORE the environment
  # protection rule — so when this outputs has_new_commits=false the release job
  # is skipped and NO approval is requested. That matters because the bot's own
  # "chore: release" commit is pushed with the PAT, which re-triggers this
  # workflow; that re-run finds nothing new and dies here silently instead of
  # nagging you for a second approval.
  check:
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check-commits.outputs.has_new_commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check for new commits since last tag
        id: check-commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          elif [ "$(git rev-list "$LAST_TAG"..HEAD --count)" -gt 0 ]; then
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          fi

  # The actual tag + release. Gated behind the `release` environment: with a
  # required reviewer configured on that environment (repo Settings ->
  # Environments -> release), GitHub PAUSES this job and waits for you to
  # Approve/Reject in the Actions UI before a single step runs. Nothing is
  # bumped, tagged, or published until you approve.
  #
  # ONE-TIME SETUP (without it, the gate is a no-op and releases run
  # immediately): Settings -> Environments -> New environment "release" ->
  # enable "Required reviewers" -> add yourself.
  release:
    needs: check
    if: needs.check.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version and generate changelog
        id: bump
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump == 'auto' && '' || github.event.inputs.bump }}
        run: node scripts/bump-version.js

      - name: Commit and tag
        if: steps.bump.outputs.new_version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push
          git push --tags

      - name: Create GitHub Release
        if: steps.bump.outputs.new_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: v${{ steps.bump.outputs.new_version }}
          body: ${{ steps.bump.outputs.changelog }}
          token: ${{ secrets.RELEASE_TOKEN }}
