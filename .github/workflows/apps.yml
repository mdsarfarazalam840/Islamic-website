name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

env:
  APP_NAME: Noor
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch data
        run: npm run fetch:all

      - name: Build static export
        run: npm run build:static

      - uses: actions/upload-artifact@v5
        with:
          name: web-out
          path: out/
          retention-days: 1

  desktop-windows:
    needs: [build-web, meta]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-pc-windows-msvc

      - name: Download web-out artifact (with retry)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $maxRetries = 10
          $retryDelay = 30
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Attempt $i of $maxRetries..."
            gh run download ${{ github.run_id }} --name web-out --dir out/
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Download successful!"
              break
            }
            if ($i -eq $maxRetries) {
              Write-Error "Download failed after $maxRetries attempts"
              exit 1
            }
            Write-Host "Download failed. Retrying in $retryDelay seconds..."
            Start-Sleep -Seconds $retryDelay
            $retryDelay = [Math]::Min($retryDelay * 2, 120)
          }

      - run: npm ci

      - run: npm install
        working-directory: apps/desktop

      - name: Build Tauri
        run: npx tauri build --target ${{ matrix.target }}-pc-windows-msvc
        working-directory: apps/desktop

      - name: Rename artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          $bundleDir = "apps/desktop/src-tauri/target/${{ matrix.target }}-pc-windows-msvc/release/bundle"

          $msi = Get-ChildItem "$bundleDir/msi/*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "$bundleDir/nsis/*.exe" | Select-Object -First 1

          $dist = New-Item -ItemType Directory -Path "dist" -Force
          if ($nsis) { Copy-Item $nsis.FullName "$dist/Noor_${version}_${{ matrix.target }}-setup.exe" }
          if ($msi) { Copy-Item $msi.FullName "$dist/Noor_${version}_${{ matrix.target }}_en-US.msi" }

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-${{ matrix.target }}
          path: dist/

  desktop-macos:
    needs: [build-web, meta]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - uses: actions/download-artifact@v5
        with:
          name: web-out
          path: out/

      - run: npm ci

      - run: npm install
        working-directory: apps/desktop

      - name: Build Tauri
        working-directory: apps/desktop
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Build attempt $attempt of $max_attempts..."
            if npx tauri build --target ${{ matrix.target }}-apple-darwin; then
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi
            echo "Build failed on attempt $attempt."
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Build failed after $max_attempts attempts."
              exit 1
            fi
            echo "Retrying in 15s (Tauri DMG bundler is flaky on CI)..."
            sleep 15
          done

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}-apple-darwin/release/bundle"
          mkdir -p dist
          cp "$BUNDLE_DIR"/dmg/*.dmg "dist/Noor_${VERSION}_${{ matrix.target }}.dmg" 2>/dev/null || true
          cp -r "$BUNDLE_DIR"/macos/*.app "dist/" 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-macos-${{ matrix.target }}
          path: dist/

  desktop-linux:
    needs: [build-web, meta]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/download-artifact@v5
        with:
          name: web-out
          path: out/

      - run: npm ci

      - run: npm install
        working-directory: apps/desktop

      - name: Build Tauri
        run: npx tauri build --target ${{ matrix.target }}-unknown-linux-gnu
        working-directory: apps/desktop

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}-unknown-linux-gnu/release/bundle"
          mkdir -p dist
          cp "$BUNDLE_DIR"/deb/*.deb "dist/Noor_${VERSION}_${{ matrix.target }}.deb" 2>/dev/null || true
          cp "$BUNDLE_DIR"/rpm/*.rpm "dist/Noor_${VERSION}_${{ matrix.target }}.rpm" 2>/dev/null || true
          cp "$BUNDLE_DIR"/appimage/*.AppImage "dist/Noor_${VERSION}_${{ matrix.target }}.AppImage" 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-linux-${{ matrix.target }}
          path: dist/

  android:
    needs: [build-web, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: actions/download-artifact@v5
        with:
          name: web-out
          path: out/

      - run: npm ci

      - run: npm install
        working-directory: apps/mobile

      - name: Add Android platform
        run: npx cap add android
        working-directory: apps/mobile

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: apps/mobile

      - name: Build APK (release)
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk "dist/Noor_${VERSION}_android_universal.apk" 2>/dev/null || \
          cp apps/mobile/android/app/build/outputs/apk/debug/*.apk "dist/Noor_${VERSION}_android_universal.apk" 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/

  release:
    needs: [desktop-windows, desktop-macos, desktop-linux, android, meta]
    runs-on: ubuntu-latest
    if: ${{ needs.meta.outputs.tag != '' }}
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.apk" \) -exec cp {} release/ \;

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -vx "${{ needs.meta.outputs.tag }}" | sed -n '1p')

          cat > RELEASE_NOTES.md << 'HEADER'
          ## What's Changed

          HEADER

          if [ -n "$PREV_TAG" ]; then
            echo "### Commits since $PREV_TAG" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --oneline --no-merges "${PREV_TAG}..HEAD" | sed 's/^/- /' >> RELEASE_NOTES.md
          else
            echo "Initial release." >> RELEASE_NOTES.md
          fi

          cat >> RELEASE_NOTES.md << 'FOOTER'

          ---

          ## Downloads

          | Platform | File | Description |
          |----------|------|-------------|
          | Windows | `*-setup.exe` | Installer (recommended) |
          | Windows | `*_en-US.msi` | MSI package (enterprise/IT deployment) |
          | macOS | `*_aarch64.dmg` | Apple Silicon (M1/M2/M3/M4) |
          | macOS | `*_x86_64.dmg` | Intel Macs |
          | Linux | `*.AppImage` | Portable, no install needed |
          | Linux | `*.deb` | Debian/Ubuntu |
          | Linux | `*.rpm` | Fedora/openSUSE |
          | Android | `*_android_universal.apk` | All Android devices |

          ## Verification

          All binaries are signed. To verify integrity:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          ## Requirements

          - **Windows:** 10 (1809+) or 11, 64-bit
          - **macOS:** 10.15 (Catalina) or later
          - **Linux:** Any distro with WebKitGTK 4.1
          - **Android:** 6.0+ (API 23)

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${{ needs.meta.outputs.tag }}
          FOOTER

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Noor ${{ needs.meta.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: |
            release/*
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          generate_release_notes: false
