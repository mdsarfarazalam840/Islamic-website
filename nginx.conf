# Serves the Next.js static export (out/) copied to /usr/share/nginx/html.
# Installed to /etc/nginx/conf.d/default.conf; the image's main nginx.conf still
# supplies mime.types (including `application/wasm` for the pagefind runtime).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the bulk of what we serve: JSON data, JS, CSS, wasm.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/wasm;

    # Content-hashed build assets never change — cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Search index fragments + data JSON: cacheable, but can change between
    # image builds, so keep the window short.
    location ~ ^/(pagefind|data)/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # trailingSlash: true means every route is exported as <route>/index.html.
    # $uri/ resolves a route directory to its index; unmatched paths fall to 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve Next's exported 404 page with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
